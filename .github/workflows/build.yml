name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 手动修复 vendor 目录
        run: |
          export THEOS=$HOME/theos
          # 1. 创建缺失的目录
          mkdir -p $THEOS/vendor/include
          mkdir -p $THEOS/vendor/lib
          mkdir -p $THEOS/sdks
          
          # 2. 下载 iPhoneOS SDK（从 GitHub 镜像）
          curl -L -o /tmp/iPhoneOS.sdk.zip https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS14.5.sdk.zip
          unzip -q /tmp/iPhoneOS.sdk.zip -d $THEOS/sdks/
          
          # 3. 创建符号链接到 vendor 目录
          ln -s $THEOS/sdks/iPhoneOS.sdk $THEOS/vendor/include
          ln -s $THEOS/sdks/iPhoneOS.sdk $THEOS/vendor/lib
          
          # 4. 设置 SDK 环境变量
          echo "SDKVERSION=14.5" >> $GITHUB_ENV
          echo "TARGET=iphone:latest:14.0" >> $GITHUB_ENV
          
          echo "Theos 和 SDK 安装完成"
          ls -la $THEOS/sdks/

      - name: 编译插件
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1

      - name: 上传 .dylib
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: .theos/obj/*.dylib
