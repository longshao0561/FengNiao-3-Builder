name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 安装 ldid 签名工具
        run: |
          # 安装 ldid（用于签名 dylib）
          curl -L -o $HOME/ldid https://github.com/ProcursusTeam/ldid/raw/master/ldid
          chmod +x $HOME/ldid
          sudo mv $HOME/ldid /usr/local/bin/
          echo "/usr/local/bin" >> $GITHUB_PATH
          # 验证安装
          ldid --version

      - name: 手动下载 SDK
        run: |
          export THEOS=$HOME/theos
          curl -L -o $THEOS/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q $THEOS/sdks.zip -d $THEOS/
          mv $THEOS/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks-master $THEOS/sdks.zip
          mkdir -p $THEOS/vendor/include $THEOS/vendor/lib
          echo "SDKVERSION=13.5" >> $GITHUB_ENV
          echo "TARGET=iphone:latest:13.5" >> $GITHUB_ENV
          echo "SDK 安装完成"

      - name: 编译插件
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1

      - name: 上传 .dylib
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: .theos/obj/*.dylib
