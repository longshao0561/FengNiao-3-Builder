name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip build-essential

      - name: 安装 Theos
        run: |
          # 克隆 Theos
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: 运行 update-theos 补全文件
        run: |
          export THEOS=/opt/theos
          # 运行更新脚本
          /opt/theos/bin/update-theos
          # 如果上面命令失败，尝试用 make 更新
          cd /opt/theos
          make update-theos || true

      - name: 手动下载 SDK（如果 update-theos 失败）
        run: |
          export THEOS=/opt/theos
          # 手动下载 SDK
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks-master/* $THEOS/sdks/
          rm -rf /tmp/sdks-master /tmp/sdks.zip
          # 创建 vendor 目录
          mkdir -p $THEOS/vendor/include $THEOS/vendor/lib
          echo "SDK 安装完成"
          ls -la $THEOS/sdks/

      - name: 验证 Theos 安装
        run: |
          export THEOS=/opt/theos
          echo "THEOS 目录内容:"
          ls -la $THEOS/
          echo ""
          echo "SDK 目录内容:"
          ls -la $THEOS/sdks/ || echo "SDK 目录不存在"
          echo ""
          echo "vendor 目录内容:"
          ls -la $THEOS/vendor/ || echo "vendor 目录不存在"

      - name: 编译插件
        run: |
          export THEOS=/opt/theos
          make clean
          make FINALPACKAGE=1

      - name: 查找编译产物
        run: |
          echo "查找 .dylib 文件..."
          find . -name "*.dylib" -type f 2>/dev/null || echo "未找到 .dylib"
          echo ""
          echo "查找 .deb 文件..."
          find . -name "*.deb" -type f 2>/dev/null || echo "未找到 .deb"
          echo ""
          echo "检查 .theos 目录..."
          ls -la .theos/ 2>/dev/null || echo ".theos 目录不存在"
          ls -la .theos/obj/ 2>/dev/null || echo "obj 目录不存在"

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: |
            **/*.dylib
            **/*.deb
