name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 编译插件 (使用 Theos Action)
        uses: theos/theos-action@v1
        with:
          package-name: URLRedirect

      - name: 上传 .deb 包
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin_Deb
          path: packages/*.deb

      - name: 上传 .dylib 文件
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin_Dylib
          path: .theos/obj/*.dylib
