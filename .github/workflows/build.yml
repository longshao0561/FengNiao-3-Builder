name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 让 Theos 自动配置环境
        run: |
          export THEOS=$HOME/theos
          # 创建空的 vendor 目录，让 Theos 自己填充
          mkdir -p $THEOS/vendor/include
          mkdir -p $THEOS/vendor/lib
          # 运行 Theos 的更新脚本
          $THEOS/bin/update-theos || true
          # 设置 SDK 版本
          echo "SDKVERSION=13.5" >> $GITHUB_ENV
          echo "TARGET=iphone:latest:13.5" >> $GITHUB_ENV

      - name: 安装 ldid
        run: |
          brew install ldid

      - name: 编译插件
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1

      - name: 上传 .dylib
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: .theos/obj/*.dylib
