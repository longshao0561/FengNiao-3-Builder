name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 禁用签名并编译
        run: |
          export THEOS=$HOME/theos
          
          # 创建配置文件禁用签名
          mkdir -p $HOME/.config/theos
          cat > $HOME/.config/theos/rc.mk << 'EOF'
          CODESIGN = NO
          DEBUG = 0
          TARGET_CODESIGN = false
          EOF
          
          # 手动下载 SDK
          curl -L -o $THEOS/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q $THEOS/sdks.zip -d $THEOS/
          mv $THEOS/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks-master $THEOS/sdks.zip
          mkdir -p $THEOS/vendor/include $THEOS/vendor/lib
          
          # 设置环境变量
          echo "SDKVERSION=13.5" >> $GITHUB_ENV
          
          # 编译
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1
          
          # 如果编译成功，手动复制未签名的 dylib
          echo "查找未签名的 dylib..."
          find . -name "*.unsigned" -type f 2>/dev/null
          find . -name "*.dylib" -type f 2>/dev/null
          
          # 复制到输出目录
          mkdir -p $GITHUB_WORKSPACE/output
          find . -name "*.dylib" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          find . -name "*.unsigned" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true

      - name: 上传 .dylib
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: output/

      - name: 上传 .deb（如果有）
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin_Deb
          path: packages/*.deb
