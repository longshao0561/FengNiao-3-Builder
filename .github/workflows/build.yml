name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          # 克隆 Theos
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          # 更新 Theos
          $HOME/theos/bin/update-theos
          
          # 设置 SDK 路径
          echo "SDKVERSION=14.5" >> $GITHUB_ENV

      - name: 验证环境
        run: |
          export THEOS=$HOME/theos
          echo "THEOS 路径: $THEOS"
          ls -la $THEOS/
          echo ""
          echo "SDK 目录:"
          ls -la $THEOS/sdks/ || echo "SDK 目录不存在"
          echo ""
          echo "toolchain 目录:"
          ls -la $THEOS/toolchain/ || echo "toolchain 目录不存在"

      - name: 编译插件
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: 查找并上传 .dylib
        run: |
          echo "查找编译产物..."
          find . -name "*.dylib" -type f
          find . -name "*.deb" -type f
          
          # 创建输出目录
          mkdir -p output
          find . -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          find . -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          
          echo "输出目录内容:"
          ls -la output/

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: output/
