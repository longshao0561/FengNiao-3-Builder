name: Build Tweak on macOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 手动修复 vendor 目录
        run: |
          export THEOS=$HOME/theos
          # 创建缺失的 vendor 目录
          mkdir -p $THEOS/vendor/include
          mkdir -p $THEOS/vendor/lib
          
          # 手动下载并安装 SDK
          curl -L -o $THEOS/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q $THEOS/sdks.zip -d $THEOS/
          mv $THEOS/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks-master $THEOS/sdks.zip
          
          # 复制 SDK 头文件到 vendor 目录
          cp -r $THEOS/sdks/* $THEOS/vendor/ 2>/dev/null || true
          
          echo "Theos 和 SDK 安装完成"
          ls -la $THEOS/vendor/

      - name: 编译插件
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1

      - name: 上传 .dylib
        uses: actions/upload-artifact@v4
        with:
          name: URLRedirect_Plugin
          path: .theos/obj/*.dylib
