name: Build Tweak on macOS (Debug)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 下载 SDK 并编译
        run: |
          export THEOS=$HOME/theos
          
          # 下载 SDK
          curl -L -o $THEOS/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q $THEOS/sdks.zip -d $THEOS/
          mv $THEOS/sdks-master/* $THEOS/sdks/
          rm -rf $THEOS/sdks-master $THEOS/sdks.zip
          mkdir -p $THEOS/vendor/include $THEOS/vendor/lib
          
          echo "SDKVERSION=13.5" >> $GITHUB_ENV
          
          # 编译
          cd $GITHUB_WORKSPACE
          make clean
          make FINALPACKAGE=1
          
          # ========== 调试：列出所有文件 ==========
          echo ""
          echo "========== 当前目录内容 =========="
          ls -la
          echo ""
          echo "========== .theos 目录内容 =========="
          ls -la .theos/ 2>/dev/null || echo ".theos 目录不存在"
          echo ""
          echo "========== .theos/obj 目录内容 =========="
          ls -la .theos/obj/ 2>/dev/null || echo ".theos/obj 目录不存在"
          echo ""
          echo "========== 所有 .dylib 文件 =========="
          find . -name "*.dylib" -type f 2>/dev/null || echo "没有找到 .dylib"
          echo ""
          echo "========== 所有 .unsigned 文件 =========="
          find . -name "*.unsigned" -type f 2>/dev/null || echo "没有找到 .unsigned"
          echo ""
          echo "========== packages 目录 =========="
          ls -la packages/ 2>/dev/null || echo "packages 目录不存在"

      - name: 上传调试信息
        uses: actions/upload-artifact@v4
        with:
          name: Debug_Info
          path: |
            .theos/
            packages/
